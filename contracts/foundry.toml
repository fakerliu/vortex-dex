[profile.default]
# Foundry 默认 profile
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# 编译器与 EVM 版本
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# 格式化器
fmt = true

# RPC 端点（部署 / 交互用，可通过环境变量覆盖）
[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"

# 区块浏览器 API 密钥（用于合约验证，敏感，经环境变量注入）
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }
